name: Publish course
on:
  pull_request:
    branches: ["courses/**"]
  push:
    branches: ["courses/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20.20.2, cache: npm, cache-dependency-path: .github/publisher/package-lock.json }
      - run: npm ci && npm run lint && npm test
        working-directory: .github/publisher
      - run: git diff --exit-code origin/master -- .github README.md course.yaml.example
      - run: npm run validate
        working-directory: .github/publisher
        env:
          GITHUB_REF_NAME: "${{ github.head_ref || github.ref_name }}"
  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    environment: appwrite
    concurrency:
      group: course-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 20.20.2 }
      - run: npm ci && npm run publish
        working-directory: .github/publisher
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ vars.APPWRITE_DATABASE_ID }}
          APPWRITE_COURSES_TABLE_ID: ${{ vars.APPWRITE_COURSES_TABLE_ID }}
          APPWRITE_MATERIALS_TABLE_ID: ${{ vars.APPWRITE_MATERIALS_TABLE_ID }}
          APPWRITE_ASSETS_TABLE_ID: ${{ vars.APPWRITE_ASSETS_TABLE_ID }}
          APPWRITE_MARKDOWN_BUCKET_ID: ${{ vars.APPWRITE_MARKDOWN_BUCKET_ID }}
          APPWRITE_MEDIA_BUCKET_ID: ${{ vars.APPWRITE_MEDIA_BUCKET_ID }}
      - run: |
          printf '## Course publication\n\n- Repository: `%s`\n- Branch: `%s`\n- Commit: `%s`\n- Result: success; retry the same commit if recovery is needed.\n' "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" "${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
