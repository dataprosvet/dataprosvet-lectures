name: Publisher baseline
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validate-publisher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 20.20.2, cache: npm, cache-dependency-path: .github/publisher/package-lock.json }
      - name: Keep master generic
        run: |
          set -eu
          test -z "$(git ls-tree -r --name-only HEAD -- course.yaml lectures lecture-notes seminars homeworks attachments assets openspec | sed '/\/\.gitkeep$/d')"
      - run: npm ci && npm run lint && npm test
        working-directory: .github/publisher
