schemaVersion: 1
slug: probability-theory
title: Теория вероятностей
description: >-
  Курс формирует последовательное понимание теории вероятностей: от случайных
  экспериментов, событий и комбинаторики до дискретных и непрерывных случайных
  величин, числовых характеристик, нормального распределения и предельных
  теорем. Каждая лекция соединяет строгие определения и выводы с прикладными
  примерами, вычислительными проверками и задачами для студентов направления
  «Прикладная информатика».
lifecycleStatus: published
availability: available
sortOrder: 1
materials:
  lectures:
    - slug: random-experiments-events-combinatorics
      title: Случайный эксперимент, события и комбинаторика
      summary: >-
        Пространство элементарных исходов, виды и операции над событиями,
        правила суммы и произведения, перестановки, размещения и сочетания.
      lifecycleStatus: published
      availability: available
      sortOrder: 1
      markdown: lectures/001_random-experiments-events-combinatorics.md
      briefMarkdown: lecture-notes/001_random-experiments-events-combinatorics.md
    - slug: event-probability-definitions
      title: Вероятность события и её определения
      summary: >-
        Аксиомы вероятности, классическое определение и равновозможность,
        относительная частота, статистическая и геометрическая вероятность.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 2
    - slug: probability-theorems
      title: Основные теоремы теории вероятностей
      summary: >-
        Теоремы сложения и умножения, условная вероятность, деревья
        вероятностей, независимость событий и формула «хотя бы одного».
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 3
    - slug: total-probability-bayes-repeated-trials
      title: Полная вероятность, Байес и повторные испытания
      summary: >-
        Разбиение на гипотезы, формулы полной вероятности и Байеса, схема
        Бернулли, наиболее вероятное число успехов и приближение Пуассона.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 4
    - slug: discrete-random-variables-distributions
      title: Дискретные случайные величины и законы распределения
      summary: >-
        Ряд, многоугольник и функция распределения дискретной случайной
        величины, биномиальный закон и распределение Пуассона.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 5
    - slug: numerical-characteristics-joint-distribution
      title: Числовые характеристики и совместное распределение
      summary: >-
        Математическое ожидание, дисперсия и стандартное отклонение, совместные
        и маргинальные распределения, ковариация, корреляция и независимость.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 6
    - slug: continuous-random-variables
      title: Непрерывные случайные величины
      summary: >-
        Плотность и функция распределения, вероятности и характеристики через
        интегрирование, равномерное и показательное распределения.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 7
    - slug: normal-distribution-limit-theorems
      title: Нормальное распределение и предельные теоремы
      summary: >-
        Стандартизация нормальной величины, правило трёх сигм, неравенство
        Чебышёва, закон больших чисел и центральная предельная теорема.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 8
