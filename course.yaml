    - slug: http-rest-openapi-data-contracts
      title: HTTP, REST, форматы данных и OpenAPI
      summary: >-
        Лекция 2: структура HTTP-запроса и ответа, HTTP/1.1–3 и gRPC, методы и коды состояния, REST, JSON/XML/CSV/YAML, схемы и валидация, OpenAPI 3.2.1 и Swagger UI. Полная лекция, краткий конспект для повторения и презентация с примерами получения готового прогноза и передачи наблюдений.
      lifecycleStatus: published
      availability: available
