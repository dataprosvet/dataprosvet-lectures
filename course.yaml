schemaVersion: 1
slug: big-data
title: Теория обработки больших данных
description: >-
  Курс вводит в большие данные применительно к сельскому хозяйству: определение
  и характеристики Big Data, форматы и методы обработки, инструменты Python,
  источники данных в растениеводстве и животноводстве, а также возможности
  и ограничения внедрения.
lifecycleStatus: published
availability: available
sortOrder: 1
materials:
