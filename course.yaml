schemaVersion: 1
slug: probability-theory
title: Теория вероятностей
description: >-
  Курс формирует последовательное понимание теории вероятностей: от случайных
  экспериментов, событий и комбинаторики до дискретных и непрерывных случайных
  величин, числовых характеристик, нормального распределения и предельных
  теорем. Каждая лекция соединяет строгие определения и выводы с прикладными
  примерами, вычислительными проверками и задачами для студентов направления
  «Прикладная информатика».
lifecycleStatus: published
availability: available
sortOrder: 1
materials:
  lectures:
    - slug: random-experiments-events-combinatorics
      title: Основные понятия теории вероятностей
      summary: >-
        Случайные эксперименты, элементарные исходы, события и операции над
        ними, несовместность, комбинаторика, определения и свойства вероятности.
      lifecycleStatus: published
      availability: available
      sortOrder: 1
      markdown: lectures/001_random-experiments-events-combinatorics.md
      briefMarkdown: lecture-notes/001_random-experiments-events-combinatorics.md
    - slug: probability-theorems-bayes
      title: Основные теоремы теории вероятностей
      summary: >-
        Условная вероятность и независимость, теоремы сложения и умножения,
        формула полной вероятности и формула Байеса с приложениями в ML.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 2
    - slug: bernoulli-laplace-poisson
      title: Формула Бернулли
      summary: >-
        Повторные независимые испытания, точная формула Бернулли, наивероятнейшее
        число успехов, локальная и интегральная теоремы Лапласа и формула Пуассона.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 3
    - slug: random-variables
      title: Случайные величины
      summary: >-
        Дискретные и непрерывные случайные величины, способы их задания, ряд и
        функция распределения, плотность и вычисление вероятностей интервалов.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 4
    - slug: numerical-characteristics
      title: Числовые характеристики случайных величин
      summary: >-
        Математическое ожидание, мода, медиана, дисперсия, среднее квадратическое
        отклонение, коэффициент вариации, моменты, асимметрия и эксцесс.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 5
    - slug: distribution-laws
      title: Некоторые примеры законов распределения
      summary: >-
        Дискретное равномерное, биномиальное, пуассоновское, геометрическое и
        гипергеометрическое распределения, а также равномерное, показательное,
        нормальное распределения и распределение Вейбулла.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 6
    - slug: law-of-large-numbers-clt
      title: Закон больших чисел
      summary: >-
        Неравенства Маркова, Чебышёва и Бернулли, закон больших чисел в формах
        Чебышёва и Бернулли, центральная предельная теорема и их интерпретация.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 7
    - slug: bivariate-random-variables
      title: Элементы двумерной случайной величины (опционально)
      summary: >-
        Факультативное знакомство с совместными и маргинальными распределениями,
        независимостью случайных величин, ковариацией и корреляцией.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 8
