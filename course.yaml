schemaVersion: 1
slug: api-technologies
title: API Технологии
description: >-
  Курс «API-технологии» для профиля «Программные решения для бизнеса» учит проектировать, реализовывать, документировать и тестировать API бизнес-приложений, включая системы с элементами ИИ. Рассматриваются HTTP/REST, OpenAPI, FastAPI, Python-клиенты и сервисы, ETL и ML-интеграции, интеграционные стили, безопасность, тестирование и мониторинг.
lifecycleStatus: published
availability: available
sortOrder: 1
materials:
  # Image attachments are derived from Obsidian/Markdown embeds during CI.
  # Authors do not need to add per-material assets entries.
  # Lectures may independently declare markdown under lectures/ and concise
  # briefMarkdown under lecture-notes/. Omitted paths stay dormant and are not
  # published; declaring a path enables strict validation and publication.
  # Any material may declare ordered files:
  # attachments: [{ key: slides, title: Slides, file: attachments/slides.pptx, sortOrder: 10 }]
