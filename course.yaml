schemaVersion: 1
slug: operating-system
title: Операционные системы
description: >-
    Курс «Операционные системы» учит понимать, как ядро управляет процессами, памятью, файлами и устройствами, и как прикладные программы взаимодействуют с ОС через системные вызовы. Рассматриваются процессы и потоки, планирование, виртуальная память, файловые системы, синхронизация и взаимные блокировки, а также практика на Linux: командная строка, процессы, права доступа и диагностика типичных сбоев.
lifecycleStatus: published
availability: available
sortOrder: 1
