schemaVersion: 1
slug: probability-theory
title: Теория вероятностей
description: >-
  Курс формирует последовательное понимание теории вероятностей: от случайных
  экспериментов, событий и комбинаторики до дискретных и непрерывных случайных
  величин, числовых характеристик, нормального распределения и предельных
  теорем. Каждая лекция соединяет строгие определения и выводы с прикладными
  примерами, вычислительными проверками и задачами для студентов направления
  «Прикладная информатика».
lifecycleStatus: published
availability: available
sortOrder: 1
materials:
  lectures:
    - slug: random-experiments-events-combinatorics
      title: Случайный эксперимент, события и комбинаторика
      summary: >-
        Пространство элементарных исходов, виды и операции над событиями,
        правила суммы и произведения, перестановки, размещения и сочетания.
      lifecycleStatus: published
      availability: available
      sortOrder: 1
      markdown: lectures/001_random-experiments-events-combinatorics.md
      briefMarkdown: lecture-notes/001_random-experiments-events-combinatorics.md
    - slug: probability-theorems-bayes
      title: Теоремы вероятностей, условная вероятность и Байес
      summary: >-
        Сложение и умножение вероятностей, условная вероятность, независимость,
        полная вероятность и байесовское обновление с примерами из ML.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 2
    - slug: bernoulli-laplace-poisson
      title: Схема Бернулли и приближения Лапласа и Пуассона
      summary: >-
        Повторные независимые испытания, точная формула Бернулли, выбор между
        нормальным и пуассоновским приближениями и контроль их предпосылок.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 3
    - slug: random-variables
      title: Дискретные и непрерывные случайные величины
      summary: >-
        Способы задания случайной величины, ряд распределения, универсальная
        функция распределения, плотность и вероятности интервалов.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 4
    - slug: numerical-characteristics
      title: Числовые характеристики случайных величин
      summary: >-
        Математическое ожидание, мода, медиана, дисперсия, стандартное
        отклонение, моменты, асимметрия и эксцесс.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 5
    - slug: distribution-laws
      title: Основные дискретные и непрерывные распределения
      summary: >-
        Равномерное, биномиальное, пуассоновское, геометрическое,
        гипергеометрическое, экспоненциальное, нормальное и распределение Вейбулла.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 6
    - slug: law-of-large-numbers-clt
      title: Неравенства, закон больших чисел и центральная предельная теорема
      summary: >-
        Неравенства Маркова, Чебышёва и Бернулли, стабилизация выборочных
        средних, ЦПТ и различие между гарантией, приближением и асимптотикой.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 7
    - slug: bivariate-random-variables
      title: Двумерные случайные величины (опционально)
      summary: >-
        Необязательное расширение после основной программы: совместные и
        маргинальные распределения, независимость, ковариация и корреляция;
        отдельного семинара или ИДЗ не требуется.
      lifecycleStatus: published
      availability: inDevelopment
      sortOrder: 8
  seminars: []
  homeworks: []
