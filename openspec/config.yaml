schema: spec-driven

context: |
  Course identity (DECIDED):
    - Title: «Теория вероятностей».
    - Audience: бакалавры направления 09.03.03 «Прикладная информатика»,
      направленность «Программные решения для бизнеса», 2 курс, 3 семестр,
      очная форма обучения.
    - Workload: 3 зачётные единицы, 108 часов; 8 лекций (16 часов),
      17 семинаров (34 часа), 57,65 часа самостоятельной работы; итоговый
      контроль — зачёт с оценкой.
    - Purpose: сформировать последовательное понимание вероятностных моделей —
      от случайных экспериментов, событий и комбинаторики до распределений,
      числовых характеристик, нормального закона и предельных теорем — и научить
      интерпретировать результаты в задачах бизнеса, информационных систем,
      надёжности и машинного обучения.

  Lecture sequence (DECIDED):
    1. Основные понятия теории вероятностей: события, операции, комбинаторика,
       определения и свойства вероятности.
    2. Основные теоремы теории вероятностей: условная вероятность,
       независимость, сложение, умножение, полная вероятность и Байес.
    3. Формула Бернулли: повторные независимые испытания, следствия,
       локальная и интегральная теоремы Лапласа, формула Пуассона.
    4. Случайные величины: дискретные и непрерывные виды, способы задания,
       ряд распределения, функция распределения и плотность.
    5. Числовые характеристики: ожидание, мода, медиана, дисперсия,
       стандартное отклонение, вариация, моменты, асимметрия и эксцесс.
    6. Примеры законов распределения: дискретное равномерное, биномиальное,
       Пуассона, геометрическое, гипергеометрическое; непрерывное равномерное,
       экспоненциальное, нормальное и Вейбулла.
    7. Закон больших чисел: неравенства Маркова, Чебышёва и Бернулли,
       теоремы Чебышёва и Бернулли, центральная предельная теорема.
    8. Элементы двумерной случайной величины — факультативно, если останется
       время; отдельный семинар не проводится, время можно отдать лекциям 1–7.

  Source hierarchy (DECIDED):
    - `sources/лекции.pdf` is the newest and highest-priority source for lecture
      titles, topic boundaries, order, and the optional status of lecture 8.
    - `sources/Б1.О.09.01 Теория вероятностей РПД СИИ ПРБ.pdf` and
      `sources/Б1.О.09.01 Теория вероятностей ОМД СИИ ПРБ.pdf` remain normative
      for workload, learning outcomes, individual assignments, control works,
      cases, and assessment except where `sources/лекции.pdf` explicitly changes
      topic placement.
    - `sources/Gmurman_V_E_Teoria_veroyatnostey_i_matematicheskaya_statistika.pdf`
      is the primary substantive source for definitions, theorem statements,
      formulas, derivations, notation comparisons, and core examples.
    - `sources/математика для машинного обучения.pdf` and
      `sources/Glubokoe_obuchenie_Pogruzhenie_v_mir_neyronnykh_setey.pdf`
      must be considered for applied interpretation, examples from data and
      machine learning, and relevant extensions beyond Gmurman.
    - `sources/4816 методичка ТВМС.pdf`,
      `sources/Savyolova_Metodicheskie_ukazaniya_k_resheniyu_zadach_po_veroyatnostnym_razdelam_2014.pdf`,
      `sources/Savelova_Metod_Monte-Karlo_2011.pdf`, and
      `sources/2_5451720465485703829.pdf` provide targeted exercises,
      computational methods, and enrichment.
    - `sources/ПЛАН_КУРСА_ТЕОРИЯ_ВЕРОЯТНОСТЕЙ_ПО_РПД.md` fixes the curriculum
      map; `sources/PLAN_LECTURE_REVISIONS_1_8.md` records revision decisions.
      `sources/archive/AUDIT_LECTURES_1_8.superseded.md` is historical only;
      the active final review is
      `openspec/changes/refine-probability-lectures-and-publish-first/review-report.md`.
    - `sources/` is a local ignored corpus and is never published. If a task
      needs direct source verification and a required file is absent, stop and
      report the missing source rather than reconstructing it from memory.

  Content products (DECIDED):
    - `lectures-teacher/` contains complete teacher scripts and is tracked but
      never published.
    - `lectures/` contains complete student lectures; `lecture-notes/` contains
      distinct concise revision notes. Both variants are tracked for all eight
      lectures, but only lecture one is declared in the current staged release.
    - Student materials contain definitions, formulas with applicability
      conditions, key conclusions, explanations/examples, and topic summaries.
    - Student materials exclude timing tables, instructor prompts, teaching advice,
      planned-error facilitation, curriculum coverage matrices, source maps, and
      reproducible generator code.
    - `attachments/` is tracked support content but is not published until a
      separate downloadable-material capability is approved.
    - Current release state: the course and lecture one are published; lecture one
      declares both complete `markdown` and concise `briefMarkdown`; lectures 2–8
      remain in development without public text declarations; the presentation is
      tracked but undeclared.

  Mathematical conventions (DECIDED):
    - Use `P(A)` for event probability and `P(A|B)` for conditional probability.
    - Use the modern distribution-function convention `F_X(x)=P(X\le x)` and
      explain translations when an older source uses a different boundary.
    - Use `M(X)=E[X]` for expectation, `D(X)=Var(X)` for variance, and
      `σ(X)=sqrt(D(X))` for standard deviation.
    - Write `X~N(μ,σ²)` so the second parameter is variance; standardization is
      `Z=(X-μ)/σ`.
    - State assumptions before using independence, Bernoulli, Poisson, Laplace,
      normal, or limit-theorem formulas. Label exact, bounded, approximate, and
      asymptotic conclusions distinctly.

  Known source defects and decisions (DECIDED):
    - Control-work task 3.5 references a missing graph. Do not invent its data;
      use only a clearly labelled educational analogue until the graph is supplied.
    - Individual assignment 6.3 omits independence. Give the covariance-aware
      general result and a separate conditional result under independence.
    - Present the general Chebyshev law of large numbers for independent variables
      with uniformly bounded variances and identify the identically distributed
      version as a useful special case.
    - Preserve the adopted `F_X(x)=P(X\le x)` convention and explain any older
      Gmurman/RPD convention explicitly.

rules:
  proposal:
    - Write all change-artifact prose in Russian for easier review; preserve only required OpenSpec syntax, technical identifiers, filenames, paths, and code tokens in their original form.
    - Keep proposals focused on course outcomes, source-grounded content, or publication-safe structure.
    - State explicit non-goals and identify any normative source defect that affects scope.
  design:
    - Write all change-artifact prose in Russian for easier review; preserve only required OpenSpec syntax, technical identifiers, filenames, paths, and code tokens in their original form.
    - Preserve the separation between teacher scripts, student notes, ignored sources, and published assets.
    - Explain how source priority and mathematical conditions will be checked.
  specs:
    - Write all change-artifact prose in Russian for easier review; preserve required OpenSpec headings and normative keywords such as SHALL, MUST, WHEN, and THEN where the validator depends on them.
    - Express educational and publication requirements as observable, verifiable behavior.
    - Do not reproduce copyrighted source passages; capture requirements and source roles instead.
  tasks:
    - Write all change-artifact prose in Russian for easier review; preserve only required checkbox syntax, technical identifiers, filenames, paths, and code tokens in their original form.
    - Keep tasks small, source-grounded, and independently verifiable.
    - Require preservation checks before replacing or shortening educational content.

operations:
  apply:
    guidance:
      - Preserve user edits and unrelated untracked files.
      - Validate teacher-file preservation before authoring student replacements.
      - Run strict OpenSpec and publisher validation before completion.
  archive:
    guidance:
      - Confirm the archived main specs retain curriculum, source hierarchy, and lecture-format requirements.
